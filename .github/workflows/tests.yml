name: CI — Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LENIN_DB: data/lenin.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn networkx numpy python-multipart pytest pytest-timeout

      - name: Restore corpus from cache
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: data/lenin.db
          key: lenin-corpus-v1

      - name: Download corpus (release asset)
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          curl -sL -o /tmp/lenin_corpus.db.gz \
            https://github.com/konantgit-sys/lenin-lab/releases/download/corpus-v1/lenin_corpus.db.gz
          gzip -d -c /tmp/lenin_corpus.db.gz > data/lenin.db
          ls -lh data/lenin.db

      - name: Start API server (full corpus)
        run: |
          nohup python3 api_v2.py 9770 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:9770/api/v1/health; then
              echo "API server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API server failed to start" && tail -20 /tmp/api.log && exit 1

      - name: Run test suite (100 tests)
        run: python -m pytest tests/ -q --timeout=90 --no-header
