# Pre-commit hooks for Lenin-Book
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: '^sites/lenin-book/'
      - id: end-of-file-fixer
        files: '^sites/lenin-book/'
      - id: check-yaml
        files: '^sites/lenin-book/'
      - id: check-json
        files: '^sites/lenin-book/'
      - id: check-merge-conflict
        files: '^sites/lenin-book/'
      - id: debug-statements
        files: '^sites/lenin-book/'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--select, 'E,F,W', --ignore, 'E501', --fix]
        files: '^sites/lenin-book/'
      - id: ruff-format
        files: '^sites/lenin-book/'

  - repo: local
    hooks:
      - id: lenin-tests
        name: Lenin-Book unit tests
        entry: bash -c 'cd sites/lenin-book && python -m pytest tests/ -q -m "not slow"'
        language: system
        files: '^sites/lenin-book/'
        types: [python]
        pass_filenames: false
        always_run: true
